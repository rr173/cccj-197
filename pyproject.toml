[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-handover"
version = "0.1.0"
description = "Offline IFC4 object repository and itemised handover subset exporter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ifcopenshell>=0.8"]

[project.scripts]
ifc-handover = "ifc_handover.cli:main"

[tool.setuptools]
packages = ["ifc_handover", "ifc_handover.diff", "ifc_handover.release"]
